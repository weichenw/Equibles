name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

# Cancel superseded runs on the same PR so we don't burn CI minutes on commits
# that have already been replaced. Pushes to main are never cancelled — each
# merged commit gets its own completed run so the branch reliably shows status.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish-images:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build worker
        run: docker build -f src/Equibles.Worker.Host/Dockerfile -t ghcr.io/weichenw/equibles-worker:${{ github.sha }} -t ghcr.io/weichenw/equibles-worker:latest .
      - name: Build web
        run: docker build -f src/Equibles.Web/Dockerfile -t ghcr.io/weichenw/equibles-web:${{ github.sha }} -t ghcr.io/weichenw/equibles-web:latest .
      - name: Build mcp
        run: docker build -f src/Equibles.Mcp.Server/Dockerfile -t ghcr.io/weichenw/equibles-mcp:${{ github.sha }} -t ghcr.io/weichenw/equibles-mcp:latest .

      - name: Push images
        run: |
          for image in worker web mcp; do
            docker push "ghcr.io/weichenw/equibles-$image:${{ github.sha }}"
            docker push "ghcr.io/weichenw/equibles-$image:latest"
          done

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Equibles.sln

      - name: Format check (CSharpier)
        run: dotnet csharpier check .

      - name: Build
        run: dotnet build Equibles.sln --no-restore -c Release

  build-and-test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Equibles.sln

      - name: Build
        run: dotnet build Equibles.sln --no-restore -c Release

      - name: Test
        # Functional tests need Playwright + a ParadeDB container and live in functional.yml.
        # Live (contract/smoke) tests hit real upstream APIs and run nightly in smoke.yml.
        # Do not pin LogFileName: with multiple test projects in the sln, a fixed
        # filename makes each project overwrite the previous TRX so only the last
        # project's results survive. Letting dotnet test auto-name produces one
        # TRX per project for dorny/test-reporter's coverage/**/*.trx glob.
        run: dotnet test Equibles.sln --no-build -c Release --filter "Category!=Functional&Category!=Live" --logger trx --collect:"XPlat Code Coverage" --settings coverage.runsettings --results-directory ./coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/**/coverage.cobertura.xml
          flags: unit-integration
          fail_ci_if_error: false

      - name: Test Report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a  # v3
        if: success() || failure()
        with:
          name: Test Results
          path: coverage/**/*.trx
          reporter: dotnet-trx
